name: srt

# Test the SRT divider in the directory srt. This only runs when something in
# that directory (or this file) changes: on pull requests, and on pushes to
# master. (Running on all pushes would test each pull request twice.)
on:
  push:
    branches:
      - master
    paths:
      - 'srt/**'
      - '.github/workflows/srt.yml'
  pull_request:
    paths:
      - 'srt/**'
      - '.github/workflows/srt.yml'

# When a pull request is updated, cancel the run for the previous commit
concurrency:
  group: srt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: srt

jobs:
  # Check the quotient digit table, and test the bit-exact model (seconds)
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the table and test the model
        run: make model
      - name: Check that the diagram data matches the table
        run: ./srt.py --tikz | diff -u pla_steps.tex -
      - name: Check the Pentium tables
        # The original table must give the Pentium's wrong result for this
        # division (with a carry-save partial remainder, the default), and the
        # fixed table must give the correct result. With an exact partial
        # remainder, the original table never fails.
        run: |
          ./srt.py --pla pentium --exact --count 10000
          ./srt.py --pla pentium_fixed --count 10000
          ./srt.py 4195835 3145727 --pla pentium | grep 'WRONG'
          ./srt.py 4195835 3145727 --pla pentium_fixed | grep -v 'WRONG' | grep '= 1.3338204492$'

  # Run the complete testbench (about a minute, twice)
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
      - name: Run the testbench
        # The testbench reports every division, so these lines are left out of
        # the log.
        run: make sim 2>&1 | grep -v 'verify:' | tee sim.log
      - name: Check that the testbench ran to the end
        run: grep 'Test finished' sim.log
      - name: Run the testbench with the original Pentium table
        # This also verifies that the divider then has the FDIV bug
        run: make sim PLA=pentium 2>&1 | grep -v 'verify:' | tee sim_pentium.log
      - name: Check that the testbench with the Pentium table ran to the end
        run: grep 'Test finished' sim_pentium.log

  # Run the formal verification of srt_core.vhd (about two minutes)
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install GHDL and Yosys
        # The GHDL plugin for Yosys needs the VHDL libraries of ghdl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl ghdl-gcc yosys yosys-plugin-ghdl python3-click
      - name: Install SymbiYosys
        # Use the version of SymbiYosys that matches the installed Yosys
        run: |
          version=$(yosys -V | awk '{print $2}')
          git clone --depth 1 --branch "yosys-$version" https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install PREFIX=/usr/local
      - name: Install Yices 2
        run: |
          curl -sSL https://github.com/SRI-CSL/yices2/releases/download/Yices-2.6.4/yices-2.6.4-x86_64-pc-linux-gnu.tar.gz | tar xz -C /tmp
          sudo cp /tmp/yices-2.6.4/bin/* /usr/local/bin/
      - name: Run the formal verification
        run: make formal
