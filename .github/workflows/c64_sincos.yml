name: c64_sincos

# Test the sine and cosine in the directory fpga/c64_sincos. This only runs when
# something in that directory (or this file) changes: on pull requests, and on
# pushes to master. (Running on all pushes would test each pull request twice.)
on:
  push:
    branches:
      - master
    paths:
      - 'fpga/c64_sincos/**'
      - '.github/workflows/c64_sincos.yml'
  pull_request:
    paths:
      - 'fpga/c64_sincos/**'
      - '.github/workflows/c64_sincos.yml'

# When a pull request is updated, cancel the run for the previous commit
concurrency:
  group: c64_sincos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: fpga/c64_sincos

jobs:
  # Run the testbench (a few seconds)
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install OSS CAD Suite
        # This contains GHDL, see fpga/README.md
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the testbench
        run: make sim

  # Run the formal verification (about 40 seconds)
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install OSS CAD Suite
        # This contains Yosys, the GHDL plugin for Yosys, SymbiYosys, and
        # Boolector 3 (the version in Ubuntu 24.04 does not work with
        # SymbiYosys), see fpga/README.md
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the formal verification
        run: make formal
