name: pipeline_sqrt

# Test the pipelined square root in the directory fpga/pipeline_sqrt. This only
# runs when something in that directory (or this file) changes: on pull
# requests, and on pushes to master. (Running on all pushes would test each pull
# request twice.)
on:
  push:
    branches:
      - master
    paths:
      - 'fpga/pipeline_sqrt/**'
      - '.github/workflows/pipeline_sqrt.yml'
  pull_request:
    paths:
      - 'fpga/pipeline_sqrt/**'
      - '.github/workflows/pipeline_sqrt.yml'

# When a pull request is updated, cancel the run for the previous commit
concurrency:
  group: pipeline_sqrt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: fpga/pipeline_sqrt

jobs:
  # Run the testbench (about 40 minutes)
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install OSS CAD Suite
        # This contains GHDL, see fpga/README.md
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the testbench
        run: make sim

  # Run the formal verification (about 20 seconds)
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install OSS CAD Suite
        # This contains Yosys, the GHDL plugin for Yosys, SymbiYosys, and
        # Boolector 3 (the version in Ubuntu 24.04 does not work with
        # SymbiYosys), see fpga/README.md
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the formal verification
        run: make formal
